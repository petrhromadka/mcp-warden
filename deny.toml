# cargo-deny policy: only the licenses the current dependency tree needs
# (verified with `cargo deny list`), crates.io as the only source.

[graph]
all-features = true

[advisories]
# Vulnerabilities, unmaintained and unsound crates fail the check (cargo-deny defaults).
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
