name: mcp-warden
description: Scan MCP servers and MCP client configs for tool poisoning, rug pulls, shadowing and leaked secrets.
author: Petr Hromádka
branding:
  icon: shield
  color: gray-dark

inputs:
  version:
    description: Release tag to install (v1.2.3, with or without the leading "v"), or "latest".
    default: latest
  verify-attestation:
    description: >-
      Verify the downloaded archive's build provenance attestation with "gh attestation verify",
      in addition to the SHA256SUMS check.
    default: "true"
  args:
    description: >-
      Arguments passed to mcp-warden (whitespace separated). The action never adds "--connect".
      Do not add "--connect" on untrusted pull requests: it starts the configured MCP server
      commands, which is remote code execution for anyone who can edit those configs.
    default: scan --no-discover
  paths:
    description: >-
      Config files or directories to scan, separated by whitespace or newlines (a multi-line
      block scalar works). Directories are treated as project roots.
    default: ""
  sarif:
    description: >-
      Write SARIF to mcp-warden.sarif and upload it to code scanning. The calling job needs
      "permissions: security-events: write". The upload fails on pull requests from forks (their
      token is read-only), so set this to false there.
    default: "true"
  fail-on:
    description: Lowest severity that fails the step (none, info, low, medium, high, critical).
    default: high

outputs:
  sarif-file:
    description: Path of the SARIF report, empty when sarif is false or no report was written.
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Install mcp-warden
      id: install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        VERIFY_ATTESTATION: ${{ inputs.verify-attestation }}
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: petrhromadka/mcp-warden
      run: |
        set -euo pipefail

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)    target=x86_64-unknown-linux-musl;   ext=tar.gz ;;
          Linux-ARM64)  target=aarch64-unknown-linux-musl;  ext=tar.gz ;;
          macOS-X64)    target=x86_64-apple-darwin;         ext=tar.gz ;;
          macOS-ARM64)  target=aarch64-apple-darwin;        ext=tar.gz ;;
          Windows-X64)  target=x86_64-pc-windows-msvc;      ext=zip ;;
          Windows-ARM64) target=aarch64-pc-windows-msvc;    ext=zip ;;
          *) echo "::error::unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac

        base="https://github.com/${REPOSITORY}/releases"
        if [[ ! $VERSION =~ ^(latest|v?[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "::error::invalid version (expected latest or vMAJOR.MINOR.PATCH)"
          exit 1
        fi
        if [ "$VERSION" = "latest" ]; then
          base="${base}/latest/download"
        else
          case "$VERSION" in v*) ;; *) VERSION="v${VERSION}" ;; esac
          base="${base}/download/${VERSION}"
        fi

        archive="mcp-warden-${target}.${ext}"
        work="$(cd "$RUNNER_TEMP" && pwd)/mcp-warden-install"
        rm -rf "$work"
        mkdir -p "$work/bin"

        curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error \
          --location --retry 3 --output "$work/$archive" "${base}/${archive}"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error \
          --location --retry 3 --output "$work/SHA256SUMS" "${base}/SHA256SUMS"

        expected="$(awk -v f="$archive" '$2 == f { print $1 }' "$work/SHA256SUMS")"
        if [ -z "$expected" ]; then
          echo "::error::${archive} is not listed in SHA256SUMS"
          exit 1
        fi
        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "$work/$archive" | awk '{ print $1 }')"
        else
          actual="$(shasum -a 256 "$work/$archive" | awk '{ print $1 }')"
        fi
        if [ "$expected" != "$actual" ]; then
          echo "::error::checksum mismatch for ${archive}: expected ${expected}, got ${actual}"
          exit 1
        fi

        # The checksum comes from the same origin as the archive; the attestation is signed
        # separately and ties the archive to this repository's release workflow.
        if [ "$VERIFY_ATTESTATION" != "false" ]; then
          gh attestation verify "$work/$archive" --repo "$REPOSITORY"
        fi

        if [ "$ext" = "zip" ]; then
          # shellcheck disable=SC2016 # $env: is PowerShell syntax
          ARCHIVE_WIN="$(cygpath -w "$work/$archive")" DEST_WIN="$(cygpath -w "$work/bin")" \
            pwsh -NoProfile -Command 'Expand-Archive -LiteralPath $env:ARCHIVE_WIN -DestinationPath $env:DEST_WIN -Force'
          bin="$work/bin/mcp-warden.exe"
        else
          tar -xzf "$work/$archive" -C "$work/bin"
          bin="$work/bin/mcp-warden"
        fi
        test -f "$bin"
        echo "bin=${bin}" >> "$GITHUB_OUTPUT"

    - name: Scan
      id: scan
      shell: bash
      env:
        BIN: ${{ steps.install.outputs.bin }}
        ARGS: ${{ inputs.args }}
        SCAN_PATHS: ${{ inputs.paths }}
        SARIF: ${{ inputs.sarif }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -o pipefail
        set -f # no pathname expansion while splitting the inputs below

        # Split on all whitespace, newlines included.
        read -r -d '' -a arg_list <<< "$ARGS" || true
        read -r -d '' -a path_list <<< "$SCAN_PATHS" || true

        cmd=("$BIN" "${arg_list[@]}" --fail-on "$FAIL_ON")
        sarif_file=""
        if [ "$SARIF" = "true" ]; then
          sarif_file="mcp-warden.sarif"
          cmd+=(--format sarif --output "$sarif_file")
        fi
        if [ "${#path_list[@]}" -gt 0 ]; then
          cmd+=(-- "${path_list[@]}")
        fi

        # GitHub runs bash with -e: capture the exit code without aborting the step, so the
        # outputs below are always written and the SARIF report is uploaded before the job fails.
        code=0
        "${cmd[@]}" || code=$?

        if [ -n "$sarif_file" ] && [ ! -f "$sarif_file" ]; then
          sarif_file=""
        fi
        {
          echo "exit-code=${code}"
          echo "sarif-file=${sarif_file}"
        } >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to code scanning
      if: ${{ always() && steps.scan.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.scan.outputs.sarif-file }}
        category: mcp-warden

    - name: Fail on findings
      if: ${{ always() && steps.scan.outputs.exit-code != '' && steps.scan.outputs.exit-code != '0' }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: exit "$EXIT_CODE"
