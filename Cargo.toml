[package]
name = "mcp-warden"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Offline static scanner for MCP servers and client configs: tool poisoning, rug pulls, shadowing, leaked secrets."
license = "MIT"
repository = "https://github.com/petrhromadka/mcp-warden"
readme = "README.md"
keywords = ["mcp", "security", "llm", "prompt-injection", "sarif"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Petr Hromádka <109349500+petrhromadka@users.noreply.github.com>"]

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.0"
ureq = { version = "3.5.1", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
